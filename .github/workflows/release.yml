# =============================================================================
# OVC — CI/CD Pipeline & Release
# =============================================================================
# Runs on every push/PR to main. Builds release binaries on version tags.
# Tag a release with: git tag v0.1.0 && git push --tags

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build frontend (needed by rust-embed in ovc-api)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-release
          path: frontend/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Lint, test, audit
  # ---------------------------------------------------------------------------
  check:
    name: Check & Test
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-release
          path: frontend/dist/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy lints
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit --ignore RUSTSEC-2023-0089 --ignore RUSTSEC-2023-0071

  # ---------------------------------------------------------------------------
  # Cross-compile native binaries for all supported platforms
  # ---------------------------------------------------------------------------
  binaries:
    name: Build binary (${{ matrix.artifact }})
    needs: [check, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ovc-linux-amd64
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ovc-linux-arm64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ovc-darwin-amd64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ovc-darwin-arm64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: ovc-windows-amd64.exe
            use_cross: false
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-release
          path: frontend/dist/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked -p ovc-cli --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked -p ovc-cli --target ${{ matrix.target }}

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Decode certificate
          echo "$APPLE_CERTIFICATE_B64" | base64 --decode > /tmp/certificate.p12

          # Create temporary keychain
          KEYCHAIN_PATH="/tmp/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import /tmp/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Find signing identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing with: $IDENTITY"

          # Sign the binary
          codesign --force --options runtime --sign "$IDENTITY" \
            --timestamp "target/${{ matrix.target }}/release/ovc"

          # Create zip for notarization
          ditto -c -k "target/${{ matrix.target }}/release/ovc" /tmp/ovc-notarize.zip

          # Submit for notarization (async — don't block CI)
          # The binary is already code-signed; notarization completes in the
          # background and is usually ready by the time anyone downloads it.
          xcrun notarytool submit /tmp/ovc-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true

          # Cleanup
          security delete-keychain "$KEYCHAIN_PATH"
          rm -f /tmp/certificate.p12 /tmp/ovc-notarize.zip

      - name: Rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/ovc"
          artifact="${{ matrix.artifact }}"
          case "$artifact" in
            *.exe) src="${src}.exe" ;;
          esac
          cp "$src" "$artifact"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ---------------------------------------------------------------------------
  # Build native desktop installers. The API service and React UI are embedded
  # in ovc-desktop, so no daemon or CLI sidecar is required at runtime.
  # ---------------------------------------------------------------------------
  desktop:
    name: Build desktop app (${{ matrix.artifact }})
    needs: [check, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            format: osx
            artifact: ovc-desktop-macos-amd64.dmg
          - target: aarch64-apple-darwin
            os: macos-latest
            format: osx
            artifact: ovc-desktop-macos-arm64.dmg
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            format: wxsmsi
            artifact: ovc-desktop-windows-amd64.msi
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            format: deb
            artifact: ovc-desktop-linux-amd64.deb
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            format: appimage
            artifact: ovc-desktop-linux-amd64.AppImage
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '12.0' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-release
          path: frontend/dist/

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ matrix.target }}-${{ matrix.format }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-${{ matrix.target }}-

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Build desktop bundle
        run: cargo bundle --release -p ovc-desktop --target ${{ matrix.target }} --format ${{ matrix.format }}

      - name: Sign, notarize, and package macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/sign-notarize-macos-app.sh \
            "target/${{ matrix.target }}/release/bundle/osx/OVC.app" \
            "${{ matrix.artifact }}"

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem "target/${{ matrix.target }}/release/bundle/${{ matrix.format }}" -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $bundle) { throw "cargo-bundle did not produce an MSI" }
          Copy-Item $bundle.FullName "${{ matrix.artifact }}"

      - name: Collect Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle=$(find "target/${{ matrix.target }}/release/bundle/${{ matrix.format }}" -maxdepth 1 -type f | head -1)
          if [ -z "$bundle" ]; then
            echo "cargo-bundle did not produce a ${{ matrix.format }} package" >&2
            exit 1
          fi
          artifact="${{ matrix.artifact }}"
          cp "$bundle" "$artifact"
          case "$artifact" in
            *.AppImage) chmod +x "$artifact" ;;
          esac

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ---------------------------------------------------------------------------
  # Create GitHub Release with binaries and SHA256 checksums
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [binaries, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: ovc-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum ovc-* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
